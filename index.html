        // Render Video Grid
        function renderVideos(filter = "すべて") {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '';

            const filteredVideos = filter === "すべて" 
                ? videos 
                : videos.filter(v => v.category === filter);

            filteredVideos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'flex flex-col cursor-pointer group';
                card.innerHTML = `
                    <div class="relative w-full aspect-video rounded-0 sm:rounded-xl overflow-hidden bg-gray-200 dark:bg-[#222]">
                        <img src="${video.thumb}" alt="${video.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-200">
                        <span class="absolute bottom-2 right-2 bg-black/80 text-white text-xs px-1.5 py-0.5 rounded font-medium">${video.duration}</span>
                    </div>
                    <div class="flex mt-3 space-x-3 px-2 sm:px-0">
                        <img src="${video.avatar}" class="w-9 h-9 rounded-full object-cover flex-shrink-0" alt="avatar">
                        <div class="flex flex-col flex-1">
                            <h3 class="font-bold text-sm line-clamp-2 leading-snug group-hover:text-blue-500 transition-colors">${video.title}</h3>
                            <span class="text-xs text-gray-500 dark:text-gray-400 mt-1 hover:text-black dark:hover:text-white">${video.channel}</span>
                            <span class="text-xs text-gray-500 dark:text-gray-400">${video.views} • ${video.time}</span>
                        </div>
                    </div>
                `;
                card.addEventListener('click', () => openModal(video));
                grid.appendChild(card);
            });
        }

        // Render Related Videos in Modal
        function renderRelatedVideos() {
            const container = document.getElementById('related-videos');
            container.innerHTML = '';
            videos.slice(0, 5).forEach(video => {
                const item = document.createElement('div');
                item.className = 'flex space-x-2 cursor-pointer group';
                item.innerHTML = `
                    <div class="relative w-36 sm:w-40 aspect-video rounded-lg overflow-hidden bg-gray-200 dark:bg-[#222] flex-shrink-0">
                        <img src="${video.thumb}" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                        <span class="absolute bottom-1 right-1 bg-black/80 text-white text-[10px] px-1 rounded">${video.duration}</span>
                    </div>
                    <div class="flex flex-col flex-1">
                        <h4 class="font-bold text-xs line-clamp-2 leading-snug group-hover:text-blue-500">${video.title}</h4>
                        <span class="text-[11px] text-gray-500 dark:text-gray-400 mt-1">${video.channel}</span>
                        <span class="text-[11px] text-gray-500 dark:text-gray-400">${video.views} • ${video.time}</span>
                    </div>
                `;
                item.addEventListener('click', () => openModal(video));
                container.appendChild(item);
            });
        }

        // Modal Controls
        const modal = document.getElementById('video-modal');
        function openModal(video) {
            document.getElementById('modal-thumbnail').src = video.thumb;
            document.getElementById('modal-title').textContent = video.title;
            document.getElementById('modal-avatar').src = video.avatar;
            document.getElementById('modal-channel').textContent = video.channel;
            document.getElementById('modal-views').textContent = video.views;
            document.getElementById('modal-likes').textContent = video.likes;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
            renderRelatedVideos();
        }

        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('close-modal').addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // Sidebar & Drawer Toggle for Mobile
        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        const sidebarBackdrop = document.getElementById('sidebar-backdrop');
        const mainContent = document.getElementById('main-content');
        let isDrawerOpen = false;

        function toggleDrawer() {
            isDrawerOpen = !isDrawerOpen;
            if (window.innerWidth >= 1024) {
                // Desktop collapsible margin toggle
                if (isDrawerOpen) {
                    sidebar.style.transform = 'translateX(-100%)';
                    mainContent.classList.remove('lg:ml-64');
                    mainContent.classList.add('lg:ml-0');
                } else {
                    sidebar.style.transform = 'translateX(0)';
                    mainContent.classList.add('lg:ml-64');
                    mainContent.classList.remove('lg:ml-0');
                }
            } else {
                // Mobile overlay drawer toggle
                if (isDrawerOpen) {
                    sidebar.style.transform = 'translateX(16rem)';
                    sidebarBackdrop.classList.remove('hidden');
                } else {
                    sidebar.style.transform = 'translateX(0)';
                    sidebarBackdrop.classList.add('hidden');
                }
            }
        }

        menuBtn.addEventListener('click', toggleDrawer);
        sidebarBackdrop.addEventListener('click', () => {
            isDrawerOpen = false;
            sidebar.style.transform = 'translateX(0)';
            sidebarBackdrop.classList.add('hidden');
        });

        // Mobile Search Toggle
        const mobileSearchToggle = document.getElementById('mobile-search-toggle');
        const mobileSearchBar = document.getElementById('mobile-search-bar');
        const mobileSearchBack = document.getElementById('mobile-search-back');

        mobileSearchToggle.addEventListener('click', () => {
            mobileSearchBar.classList.remove('hidden');
            mobileSearchBar.classList.add('flex');
            document.getElementById('mobile-search-input').focus();
        });

        mobileSearchBack.addEventListener('click', () => {
            mobileSearchBar.classList.add('hidden');
            mobileSearchBar.classList.remove('flex');
        });

        // Theme Toggle
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        themeToggle.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
            } else {
                htmlElement.classList.add('dark');
            }
        });

        // Filter Chip Interactions
        const chips = document.querySelectorAll('.chip');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => {
                    c.classList.remove('bg-black', 'dark:bg-white', 'text-white', 'dark:text-black');
                    c.classList.add('bg-gray-100', 'dark:bg-[#272727]');
                });
                chip.classList.add('bg-black', 'dark:bg-white', 'text-white', 'dark:text-black');
                chip.classList.remove('bg-gray-100', 'dark:bg-[#272727]');
                renderVideos(chip.textContent);
            });
        });

        // Initial Load
        window.onload = () => {
            renderVideos();
        };
    </script>
